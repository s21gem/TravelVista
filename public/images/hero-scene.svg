<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMax slice" role="img" aria-label="">
  <!--
    The hero's scenic band. Deliberately transparent above the horizon so the
    hero's own brand gradient shows through and the headline stays legible;
    only the lower third carries artwork.
  -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02b5fb" stop-opacity=".55"/>
      <stop offset="1" stop-color="#01278a" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01278a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#01278a" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fc7701" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fc7701" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fdb801" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- far ridge line -->
  <path d="M0 300l190-116 128 84 118-64 176 108 150-90 206 130 150-84 282 150v202H0z" fill="url(#ridgeFar)"/>
  <path d="M190 184l62 40-62 26-52-30z" fill="#fff" fill-opacity=".38"/>
  <path d="M612 212l52 34-52 24-44-28z" fill="#fff" fill-opacity=".28"/>

  <!-- near headland -->
  <path d="M0 372l236-124 156 88 130-58 214 120 178-96 322 156 364-92v154H0z" fill="url(#ridgeNear)"/>

  <!-- sea -->
  <path d="M0 400h1600v120H0z" fill="url(#sea)"/>
  <g fill="#fff" fill-opacity=".22">
    <path d="M120 448h180a44 44 0 0 1-180 0z"/>
    <path d="M560 476h210a50 50 0 0 1-210 0z"/>
    <path d="M1010 452h190a46 46 0 0 1-190 0z"/>
    <path d="M1300 490h170a42 42 0 0 1-170 0z"/>
  </g>

  <!-- the orange swoosh from the mark, sweeping across the horizon -->
  <path d="M-40 424C240 330 700 296 1120 336c220 20 380 62 520 108-150-30-330-56-540-70-420-28-860 8-1140 96z"
        fill="url(#swoosh)"/>

  <!-- palm on the left shore -->
  <path d="M96 520c4-72 10-124 20-182" stroke="#01278a" stroke-opacity=".8" stroke-width="13" fill="none" stroke-linecap="round"/>
  <g fill="#01278a" fill-opacity=".8">
    <path d="M118 330c-40-22-80-14-102 10 36-6 70 0 102 12z"/>
    <path d="M118 330c38-24 80-18 104 8-38-8-72-4-104 12z"/>
    <path d="M118 330c-12-42 4-78 38-96-18 30-32 62-38 92z"/>
    <path d="M118 330c20-36 56-52 98-46-34 8-70 22-94 48z"/>
  </g>

  <!-- the plane from the mark, climbing away -->
  <g fill="#fff" fill-opacity=".9">
    <path d="M1338 150l86-44-28 58 44 22-50 14-22 44-14-44-36 8z"/>
  </g>
  <path d="M1180 236c60-30 110-56 152-80" stroke="#fff" stroke-opacity=".35" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="14 16" fill="none"/>

  <!-- birds -->
  <g stroke="#fff" stroke-opacity=".45" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M980 148c14-16 28-16 42 0"/>
    <path d="M1040 112c12-14 24-14 36 0"/>
  </g>
</svg>
