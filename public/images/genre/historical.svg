<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Historical destinations">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0056c7"/><stop offset=".5" stop-color="#8fd8f5"/><stop offset="1" stop-color="#fde3a7"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fce8a3"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd888"/><stop offset="1" stop-color="#a35400"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fdb801" stop-opacity=".8"/><stop offset="1" stop-color="#fdb801" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="400" cy="286" r="190" fill="url(#glow)"/>
  <circle cx="400" cy="286" r="70" fill="#fdb801"/>

  <!-- distant hills -->
  <path d="M0 520c120-52 210 8 330-16 110-22 190-30 300 4 62 20 122 26 170 22v38H0z" fill="#0069e6" opacity=".45"/>

  <!-- pediment -->
  <path d="M400 168l232 122H168z" fill="url(#stone)"/>
  <path d="M400 168l232 122H400z" fill="#fcd888" opacity=".55"/>
  <rect x="150" y="290" width="500" height="30" fill="url(#stone)"/>
  <rect x="150" y="290" width="500" height="10" fill="#fff"/>

  <!-- columns -->
  <g fill="url(#stone)">
    <rect x="178" y="320" width="52" height="260"/>
    <rect x="262" y="320" width="52" height="260"/>
    <rect x="346" y="320" width="52" height="260"/>
    <rect x="430" y="320" width="52" height="260"/>
    <rect x="514" y="320" width="52" height="260"/>
    <rect x="586" y="320" width="52" height="260"/>
  </g>
  <!-- fluting shadow -->
  <g fill="#a35400" opacity=".18">
    <rect x="214" y="320" width="16" height="260"/><rect x="298" y="320" width="16" height="260"/>
    <rect x="382" y="320" width="16" height="260"/><rect x="466" y="320" width="16" height="260"/>
    <rect x="550" y="320" width="16" height="260"/><rect x="622" y="320" width="16" height="260"/>
  </g>
  <!-- capitals -->
  <g fill="#fff">
    <rect x="170" y="320" width="68" height="14"/><rect x="254" y="320" width="68" height="14"/>
    <rect x="338" y="320" width="68" height="14"/><rect x="422" y="320" width="68" height="14"/>
    <rect x="506" y="320" width="68" height="14"/><rect x="578" y="320" width="68" height="14"/>
  </g>

  <!-- stylobate steps -->
  <rect x="140" y="580" width="520" height="26" fill="url(#stone)"/>
  <rect x="112" y="606" width="576" height="26" fill="#fce8a3"/>
  <rect x="84"  y="632" width="632" height="26" fill="#fcd888"/>

  <!-- ground -->
  <rect y="658" width="800" height="142" fill="url(#ground)"/>

  <!-- cypress trees -->
  <g fill="#058704">
    <ellipse cx="52" cy="600" rx="26" ry="66"/>
    <ellipse cx="748" cy="606" rx="24" ry="60"/>
  </g>

  <!-- birds -->
  <g stroke="#01278a" stroke-width="6" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M150 168c12-14 24-14 36 0"/>
    <path d="M196 136c10-12 20-12 30 0"/>
  </g>
</svg>
