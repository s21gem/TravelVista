<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Island destinations">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0069e6"/><stop offset=".55" stop-color="#8fd8f5"/><stop offset="1" stop-color="#fde3a7"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02b5fb"/><stop offset=".4" stop-color="#0087fb"/><stop offset="1" stop-color="#0039a6"/>
    </linearGradient>
    <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce8a3"/><stop offset="1" stop-color="#fcd888"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fdb801" stop-opacity=".85"/><stop offset="1" stop-color="#fdb801" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="620" cy="240" r="150" fill="url(#glow)"/>
  <circle cx="620" cy="240" r="62" fill="#fdb801"/>

  <!-- horizon and sea -->
  <rect y="430" width="800" height="370" fill="url(#sea)"/>
  <rect y="430" width="800" height="8" fill="#fff" opacity=".35"/>
  <path d="M596 430h48l-16 370h-16z" fill="#fde3a7" opacity=".4"/>

  <!-- distant islet -->
  <path d="M60 430c14-30 44-46 78-46s64 16 78 46z" fill="#0048b6" opacity=".55"/>

  <!-- the island -->
  <path d="M256 496c0-72 66-124 148-124s148 52 148 124z" fill="#058704"/>
  <path d="M400 372c82 0 148 52 148 124H400z" fill="#037706"/>
  <ellipse cx="400" cy="500" rx="216" ry="34" fill="url(#shore)"/>
  <ellipse cx="400" cy="500" rx="216" ry="34" fill="#fff" opacity=".18"/>

  <!-- palms on the island -->
  <path d="M338 470c2-44 6-70 12-96" stroke="#a35400" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g fill="#0aa30a">
    <path d="M352 372c-38-20-72-12-92 12 34-6 64 0 92 8z"/>
    <path d="M352 372c36-22 72-16 94 8-34-8-66-4-94 10z"/>
    <path d="M352 372c-12-38 2-70 34-88-16 28-28 58-32 84z"/>
  </g>
  <circle cx="352" cy="372" r="10" fill="#a35400"/>

  <path d="M466 476c-2-36-4-58-8-80" stroke="#a35400" stroke-width="10" fill="none" stroke-linecap="round"/>
  <g fill="#058704">
    <path d="M456 392c-30-16-58-10-74 10 28-6 52 0 74 6z"/>
    <path d="M456 392c30-18 58-12 76 6-28-6-54-2-76 8z"/>
    <path d="M456 392c-10-30 2-56 28-70-14 22-24 46-26 68z"/>
  </g>
  <circle cx="456" cy="392" r="9" fill="#a35400"/>

  <!-- waves -->
  <g fill="#fff" opacity=".42">
    <path d="M70 580h150a38 38 0 0 1-150 0z"/>
    <path d="M560 616h170a42 42 0 0 1-170 0z"/>
    <path d="M240 686h190a46 46 0 0 1-190 0z"/>
    <path d="M600 726h150a38 38 0 0 1-150 0z"/>
  </g>

  <!-- birds -->
  <g stroke="#01278a" stroke-width="6" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M156 216c12-14 24-14 36 0"/>
    <path d="M204 182c10-12 20-12 30 0"/>
  </g>
</svg>
