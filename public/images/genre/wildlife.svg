<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Wildlife destinations">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0069e6"/><stop offset=".45" stop-color="#8fd8f5"/><stop offset="1" stop-color="#fdc701"/>
    </linearGradient>
    <linearGradient id="plain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0aa30a"/><stop offset="1" stop-color="#058704"/>
    </linearGradient>
    <linearGradient id="plain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#058704"/><stop offset="1" stop-color="#037706"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fdb801" stop-opacity=".9"/><stop offset="1" stop-color="#fdb801" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="400" cy="352" r="210" fill="url(#glow)"/>
  <circle cx="400" cy="352" r="98" fill="#fdc701"/>

  <!-- distant hills -->
  <path d="M0 500c110-40 190 12 300-10 100-20 180-28 290 6 60 18 148 22 210 18v42H0z" fill="#0048b6" opacity=".35"/>

  <!-- savanna -->
  <path d="M0 540c140-30 230 26 350 6 108-18 190-30 292 4 56 18 110 22 158 20v230H0z" fill="url(#plain)"/>
  <path d="M0 648c160-26 250 32 368 10 110-20 196-28 294 4 50 16 96 18 138 16v122H0z" fill="url(#plain2)"/>

  <!-- acacia tree -->
  <path d="M170 660c4-70 8-110 12-150" stroke="#a35400" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M182 510c-30-14-58-8-74 10 26-8 50-6 74 2z" fill="#a35400"/>
  <ellipse cx="184" cy="466" rx="112" ry="42" fill="#058704"/>
  <ellipse cx="184" cy="452" rx="86" ry="30" fill="#0aa30a"/>

  <!-- small acacia -->
  <path d="M676 664c2-46 4-74 8-100" stroke="#a35400" stroke-width="11" fill="none" stroke-linecap="round"/>
  <ellipse cx="684" cy="556" rx="72" ry="28" fill="#058704"/>
  <ellipse cx="684" cy="546" rx="54" ry="20" fill="#0aa30a"/>

  <!-- elephant silhouette -->
  <g fill="#01278a">
    <path d="M356 700c-14-6-22-20-22-40 0-52 40-92 96-92s96 40 96 92c0 20-8 34-22 40z"/>
    <path d="M334 630c-26-4-42-24-42-52 0-24 14-40 34-40 22 0 36 18 36 44z"/>
    <path d="M330 616c-16-16-18-42-6-62-4 26 0 46 12 62z"/>
    <path d="M298 596c-16 10-22 34-16 62 4 20 0 36-12 46l16 12c18-14 24-36 20-62-4-22 0-42 12-52z"/>
    <rect x="352" y="694" width="28" height="46" rx="10"/>
    <rect x="396" y="698" width="28" height="42" rx="10"/>
    <rect x="446" y="698" width="28" height="42" rx="10"/>
    <rect x="488" y="694" width="28" height="46" rx="10"/>
    <path d="M338 566c14-10 30-6 36 8l-30 10z" opacity=".85"/>
  </g>
  <circle cx="336" cy="590" r="7" fill="#fce8a3"/>
  <path d="M312 630c14 6 24 4 32-4" stroke="#fce8a3" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>

  <!-- grass tufts -->
  <g stroke="#037706" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M60 776c0-20 6-34 16-44M76 776c0-22-2-36-8-48M92 776c2-20 10-32 22-40"/>
    <path d="M600 786c0-18 6-30 14-40M616 786c0-20-2-32-8-42"/>
  </g>

  <!-- birds -->
  <g stroke="#01278a" stroke-width="6" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M556 196c12-14 24-14 36 0"/>
    <path d="M604 164c10-12 20-12 30 0"/>
  </g>
</svg>
