<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="City destinations">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0039a6"/><stop offset=".45" stop-color="#0087fb"/><stop offset="1" stop-color="#fde3a7"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0069e6"/><stop offset="1" stop-color="#0048b6"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0048b6"/><stop offset="1" stop-color="#01278a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02b5fb"/><stop offset="1" stop-color="#0056c7"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fdb801" stop-opacity=".8"/><stop offset="1" stop-color="#fdb801" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="404" cy="330" r="160" fill="url(#glow)"/>
  <circle cx="404" cy="330" r="60" fill="#fdb801"/>

  <!-- far skyline -->
  <g fill="url(#far)" opacity=".8">
    <rect x="40" y="420" width="60" height="200"/>
    <rect x="118" y="376" width="46" height="244"/>
    <rect x="600" y="392" width="54" height="228"/>
    <rect x="676" y="440" width="62" height="180"/>
  </g>

  <!-- near skyline -->
  <g fill="url(#near)">
    <rect x="86" y="470" width="86" height="180"/>
    <rect x="192" y="392" width="70" height="258"/>
    <rect x="282" y="500" width="92" height="150"/>
    <rect x="394" y="300" width="78" height="350"/>
    <rect x="492" y="424" width="100" height="226"/>
    <rect x="612" y="486" width="80" height="164"/>
  </g>

  <!-- spire on the tallest tower -->
  <rect x="394" y="278" width="78" height="14" fill="#fc7701"/>
  <rect x="427" y="228" width="12" height="52" fill="#fc7701"/>
  <circle cx="433" cy="222" r="11" fill="#fdb801"/>

  <!-- lit windows -->
  <g fill="#fde3a7">
    <rect x="104" y="492" width="14" height="20"/><rect x="132" y="492" width="14" height="20"/>
    <rect x="104" y="530" width="14" height="20"/><rect x="132" y="530" width="14" height="20"/>
    <rect x="104" y="568" width="14" height="20"/>
    <rect x="210" y="416" width="14" height="20"/><rect x="238" y="416" width="14" height="20"/>
    <rect x="210" y="454" width="14" height="20"/><rect x="238" y="454" width="14" height="20"/>
    <rect x="210" y="492" width="14" height="20"/><rect x="238" y="530" width="14" height="20"/>
    <rect x="300" y="524" width="14" height="20"/><rect x="330" y="524" width="14" height="20"/>
    <rect x="300" y="562" width="14" height="20"/>
    <rect x="412" y="324" width="14" height="20"/><rect x="440" y="324" width="14" height="20"/>
    <rect x="412" y="362" width="14" height="20"/><rect x="440" y="362" width="14" height="20"/>
    <rect x="412" y="400" width="14" height="20"/><rect x="440" y="438" width="14" height="20"/>
    <rect x="412" y="476" width="14" height="20"/><rect x="440" y="514" width="14" height="20"/>
    <rect x="510" y="448" width="14" height="20"/><rect x="540" y="448" width="14" height="20"/>
    <rect x="570" y="448" width="14" height="20"/><rect x="510" y="486" width="14" height="20"/>
    <rect x="540" y="524" width="14" height="20"/>
    <rect x="630" y="510" width="14" height="20"/><rect x="660" y="510" width="14" height="20"/>
  </g>

  <!-- waterfront -->
  <path d="M0 650h800v150H0z" fill="url(#water)"/>
  <path d="M380 650h48l-16 150h-18z" fill="#fde3a7" opacity=".5"/>
  <g fill="#fff" opacity=".38">
    <path d="M80 700h140a36 36 0 0 1-140 0z"/>
    <path d="M520 742h170a42 42 0 0 1-170 0z"/>
  </g>

  <!-- quayside trees -->
  <g fill="#058704">
    <circle cx="46" cy="628" r="26"/><circle cx="756" cy="630" r="24"/>
  </g>
</svg>
