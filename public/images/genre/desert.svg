<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Desert destinations">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0056c7"/><stop offset=".45" stop-color="#0087fb"/><stop offset="1" stop-color="#fdc701"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fce8a3"/><stop offset="1" stop-color="#fdb801"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdb801"/><stop offset="1" stop-color="#fc7701"/>
    </linearGradient>
    <linearGradient id="dune3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fc7701"/><stop offset="1" stop-color="#a35400"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fdb801" stop-opacity=".9"/><stop offset="1" stop-color="#fdb801" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>
  <circle cx="400" cy="330" r="220" fill="url(#glow)"/>
  <circle cx="400" cy="330" r="92" fill="#fdc701"/>
  <circle cx="400" cy="330" r="126" fill="none" stroke="#fce8a3" stroke-opacity=".45" stroke-width="4"/>

  <!-- rock mesa -->
  <path d="M596 460h150v-84h-24v-26h-46v26h-80z" fill="#a35400" opacity=".5"/>

  <!-- dunes, back to front -->
  <path d="M0 470c130-52 216 22 330-8 108-28 190-52 300-14 66 22 122 30 170 26v326H0z" fill="url(#dune1)"/>
  <path d="M0 556c150-44 240 34 356 6 110-26 194-46 300-6 56 22 100 26 144 22v222H0z" fill="url(#dune2)"/>
  <path d="M0 654c168-32 262 40 380 14 112-24 200-34 296 2 48 18 92 20 124 18v112H0z" fill="url(#dune3)"/>

  <!-- ripples on the sand -->
  <g stroke="#a35400" stroke-opacity=".3" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M60 720c60-16 120-16 180 0"/>
    <path d="M300 760c70-18 140-18 210 0"/>
    <path d="M540 706c60-14 120-14 180 0"/>
  </g>

  <!-- cactus -->
  <g fill="#058704">
    <rect x="150" y="470" width="34" height="200" rx="17"/>
    <path d="M167 546c-46 0-68-32-68-72 40 4 68 28 68 72z"/>
    <path d="M167 588c46 0 68-32 68-72-40 4-68 28-68 72z"/>
  </g>
  <g fill="#037706" opacity=".55">
    <rect x="150" y="470" width="14" height="200" rx="7"/>
  </g>

  <!-- camel silhouette -->
  <g fill="#01278a" opacity=".82">
    <path d="M604 640c-6-22 4-40 22-46 10-22 26-22 34-4 12-24 32-22 40 2 16 6 24 22 20 48z"/>
    <path d="M610 636l-6 44h10l8-40zM640 640l-2 44h10l2-44zM672 640l2 44h10l-2-44zM700 636l8 44h10l-6-44z"/>
    <path d="M700 592c8-14 22-16 30-6l-6 16z"/>
  </g>
</svg>
